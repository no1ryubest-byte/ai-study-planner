<title>AI学習プランナー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root {
  /* Layout: 方眼ノート1枚の1カラム（最大640px）。上に日付と試験までの日数、下にタブ。
     ライトはノート、ダークは黒板。完了は赤ペンの○、進み具合は蛍光ペン。 */
  --paper: #F1F5F6;
  --grid: #DCE7EB;
  --sheet: #FFFFFF;
  --sheet-2: #F5F8F9;
  --rule: #E0E9EC;
  --ink: #1B2731;
  --ink-2: #4D5E6A;
  --ink-3: #7F8F99;
  --blue: #2350B5;
  --blue-ink: #FFFFFF;
  --blue-soft: #E3EAF9;
  --red: #D02F2B;
  --marker: #F1E46A;
  --marker-soft: rgba(241, 228, 106, 0.8);
  --note: #FFF5C2;
  --note-ink: #463E1C;
  --warn: #9E5300;
  --warn-note: #FFE6C4;
  --ok: #26703F;
  --ok-soft: #DCF0E2;
  --tile-ink: #FFFFFF;
  --shadow: 0 1px 2px rgba(27, 39, 49, 0.06), 0 6px 18px rgba(27, 39, 49, 0.07);
  --scrim: rgba(16, 24, 30, 0.62);
  --on-scrim: #FFFFFF;
  --c0: #3B6CD0; --c1: #2B8F64; --c2: #CB7420; --c3: #8456C2;
  --c4: #C84866; --c5: #1E8794; --c6: #7F8420; --c7: #925F40;
  --f-display: "Klee One", "UD Digi Kyokasho N-R", "YuKyokasho", "Hiragino Mincho ProN", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #16221D; --grid: #1C2924; --sheet: #1D2B25; --sheet-2: #22312B; --rule: #2D3F37;
    --ink: #EDF1E9; --ink-2: #B4C2B9; --ink-3: #7F9188;
    --blue: #93B6FF; --blue-ink: #0D1A30; --blue-soft: #22364F;
    --red: #FF8A84; --marker: #E3D468; --marker-soft: rgba(227, 212, 104, 0.3); --note: #2F3926; --note-ink: #EFE6B4;
    --warn: #FFB35E; --warn-note: #3A2F20; --ok: #82D3A2; --ok-soft: #20382B;
    --tile-ink: #13201A; --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 22px rgba(0, 0, 0, 0.28);
    --c0: #8DB0FF; --c1: #7DD3AC; --c2: #F2B168; --c3: #C4A0F0;
    --c4: #F497AE; --c5: #78CEDA; --c6: #CDD27A; --c7: #D8AC8A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #16221D; --grid: #1C2924; --sheet: #1D2B25; --sheet-2: #22312B; --rule: #2D3F37;
  --ink: #EDF1E9; --ink-2: #B4C2B9; --ink-3: #7F9188;
  --blue: #93B6FF; --blue-ink: #0D1A30; --blue-soft: #22364F;
  --red: #FF8A84; --marker: #E3D468; --marker-soft: rgba(227, 212, 104, 0.3); --note: #2F3926; --note-ink: #EFE6B4;
  --warn: #FFB35E; --warn-note: #3A2F20; --ok: #82D3A2; --ok-soft: #20382B;
  --tile-ink: #13201A; --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 22px rgba(0, 0, 0, 0.28);
  --c0: #8DB0FF; --c1: #7DD3AC; --c2: #F2B168; --c3: #C4A0F0;
  --c4: #F497AE; --c5: #78CEDA; --c6: #CDD27A; --c7: #D8AC8A;
  color-scheme: dark;
}

html { -webkit-text-size-adjust: 100%; }
/* 幅に余白と枠線を含める。ブラウザによって入力欄の既定が違い、はみ出すのを防ぐ */
*, *::before, *::after, input, textarea, select, button { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.65;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.app {
  max-width: 672px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(100px + env(safe-area-inset-bottom, 0px));
  display: grid;
  gap: 4px;
}
.app > * { min-width: 0; }

/* ---------- ヘッダー ---------- */
.top { display: grid; gap: 4px; padding-block: 2px 10px; min-width: 0; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--ink-2); }
.save { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.save::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
.save.cloud::before { background: var(--ok); }
.save.memory::before { background: var(--warn); }
.date { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 30px; line-height: 1.25; letter-spacing: 0.02em; text-wrap: balance; }
.date small { margin-left: 8px; font-size: 16px; color: var(--ink-2); letter-spacing: 0.04em; }
.cds { list-style: none; margin: 6px 0 0; padding: 0 0 4px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.cds::-webkit-scrollbar { display: none; }
.cd { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--sheet); border: 1px solid var(--rule); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.cd b { font-family: var(--f-num); font-weight: 600; font-size: 12px; color: var(--ink); }
.cd .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.cd.soon b { color: var(--warn); }
.cd.today { border-color: var(--red); }
.cd.today b { color: var(--red); }

/* ---------- 共通 ---------- */
.h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 21px; line-height: 1.35; text-wrap: balance; }
.section { display: grid; gap: 10px; margin-top: 24px; }
.section.first { margin-top: 8px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.sec-note { font-size: 12px; color: var(--ink-3); }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); }
.help { margin: 0; font-size: 12.5px; color: var(--ink-3); line-height: 1.6; }
.tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--ink-2); background: var(--sheet-2); border: 1px solid var(--rule); vertical-align: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent; font-size: 14px; font-weight: 700; cursor: pointer; text-align: center; line-height: 1.3; }
.btn.primary { background: var(--blue); color: var(--blue-ink); }
.btn.ghost { background: var(--sheet); color: var(--ink); border-color: var(--rule); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
.btn.danger { background: transparent; color: var(--red); border-color: currentColor; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.linkish { border: 0; background: none; padding: 0; color: var(--blue); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--rule); background: var(--sheet-2); color: var(--ink-2); font-size: 12.5px; cursor: pointer; line-height: 1.4; }
.chip.on { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); font-weight: 700; }

.tile { width: 40px; height: 40px; border-radius: 9px; background: var(--c); color: var(--tile-ink); display: grid; place-items: center; font-weight: 700; font-size: 17px; line-height: 1; flex: none; }
.tile.sm { width: 32px; height: 32px; border-radius: 8px; font-size: 14px; }

.pill { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
.st-ok, .st-done { color: var(--ok); background: var(--ok-soft); }
.st-tight, .st-short { color: var(--warn); background: var(--warn-note); }
.st-exam { color: var(--red); border-color: var(--red); }
.st-passed { color: var(--ink-3); background: var(--sheet-2); }

/* 付箋のお知らせ */
.note { display: grid; gap: 10px; padding: 12px 14px; border-radius: 3px; background: var(--note); color: var(--note-ink); font-size: 13.5px; line-height: 1.65; box-shadow: var(--shadow); }
.note.warn { background: var(--warn-note); }
.note p { margin: 0; }
.notes { display: grid; gap: 10px; margin-bottom: 14px; }

/* ---------- 今日 ---------- */
.summary { display: grid; gap: 10px; margin: 6px 0 16px; }
.sum-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.cap-btn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--rule); background: var(--sheet); font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.cap-btn b { font-family: var(--f-num); color: var(--ink); font-weight: 600; }
.meter { position: relative; height: 16px; border-radius: 3px; background: var(--sheet); border: 1px solid var(--rule); overflow: hidden; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--marker); transition: width 0.45s ease; }
.meter-text { margin: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; color: var(--ink-2); }
.meter-text .big { font-family: var(--f-num); font-size: 24px; font-weight: 600; color: var(--ink); line-height: 1.1; }
.cap-edit { display: grid; gap: 8px; padding: 12px 14px; }
.cap-edit p { margin: 0; font-size: 13px; color: var(--ink-2); }

.sess-list { list-style: none; margin: 0; padding: 0; }
.sess { display: grid; grid-template-columns: 40px minmax(0, 1fr) 44px; gap: 12px; align-items: start; padding: 14px 10px 14px 14px; border-top: 1px dashed var(--rule); }
.sess:first-child { border-top: 0; }
.sess-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.sess-subj { font-size: 15.5px; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
.sess-min { font-family: var(--f-num); font-size: 15px; font-weight: 600; white-space: nowrap; }
.sess-min small { margin-left: 1px; font-family: var(--f-body); font-size: 11px; font-weight: 500; color: var(--ink-2); }
.sess-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 3px; font-size: 13.5px; color: var(--ink-2); }
.sess-unit { overflow-wrap: anywhere; }
.ph { padding: 0 7px; border-radius: 4px; border: 1px solid currentColor; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; line-height: 1.6; white-space: nowrap; }
.ph-learn { color: var(--blue); }
.ph-practice { color: var(--ink); }
.ph-review { color: var(--ok); }
.ph-final { color: var(--red); }
.sess-hint { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); line-height: 1.6; }
.ai-mark { display: inline-block; margin-right: 6px; padding: 0 5px; border-radius: 3px; background: var(--blue-soft); color: var(--blue); font-family: var(--f-num); font-size: 10px; font-weight: 600; vertical-align: 1px; }
.ai-mark.base { background: none; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--rule); font-family: var(--f-body); }
/* AIの進め方（ゴール・手順と分・ポイント） */
.adv { margin: 8px 0 0; padding: 8px 10px 9px; border-left: 2px solid var(--blue-soft); background: var(--sheet-2); border-radius: 0 3px 3px 0; }
.adv-head { margin: 0; font-size: 13.5px; font-weight: 600; line-height: 1.55; color: var(--ink); overflow-wrap: anywhere; }
.adv-plan { list-style: none; display: grid; gap: 3px; margin: 6px 0 0; padding: 0; }
.adv-plan li { display: grid; grid-template-columns: 3.2em minmax(0, 1fr); gap: 8px; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.adv-plan li span:last-child { overflow-wrap: anywhere; }
.adv-min { font-family: var(--f-num); font-size: 12px; font-weight: 600; color: var(--blue); text-align: right; white-space: nowrap; padding-top: 1px; }
.adv-point { margin: 7px 0 0; padding-top: 6px; border-top: 1px dashed var(--rule); font-size: 12.5px; line-height: 1.6; color: var(--ink-2); overflow-wrap: anywhere; }
.adv-point b { margin-right: 6px; color: var(--red); font-weight: 700; }
.adv-cheer { display: block; margin-top: 2px; color: var(--ink-3); }
.ai-ask { display: block; margin-top: 4px; }
/* 端末のAIの動作チェック */
.ai-state { font-size: 13.5px !important; color: var(--ink) !important; font-weight: 600; }
.check-list { list-style: none; display: grid; gap: 6px; margin: 4px 0 0; padding: 0; }
.check-list li { display: grid; grid-template-columns: 1.4em minmax(0, 1fr) auto; gap: 2px 8px; align-items: baseline; padding: 6px 0; border-top: 1px dashed var(--rule); font-size: 13.5px; }
.check-list li:first-child { border-top: 0; }
.check-list .ck { font-weight: 700; color: var(--ink-3); }
.check-list li.ok .ck { color: var(--red); }
.check-list li.ng .ck { color: var(--ink-2); }
.check-list .nm { overflow-wrap: anywhere; }
.check-list .sec { font-family: var(--f-num); font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.check-list small { grid-column: 2 / -1; color: var(--ink-2); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
.sess.is-done .sess-subj, .sess.is-done .sess-meta, .sess.is-done .sess-hint, .sess.is-done .adv, .sess.is-done .sess-min, .sess.is-done .tile { opacity: 0.5; }
.check { width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--ink-3); cursor: pointer; }
.check svg { display: block; width: 44px; height: 44px; overflow: visible; }
.ck-ring { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-dasharray: 2.4 3.1; }
.is-done .ck-ring { stroke: transparent; }
.pen { fill: none; stroke: var(--red); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.pen.draw { stroke-dasharray: 100; stroke-dashoffset: 100; animation: pen 0.42s ease-out forwards; }
@keyframes pen { to { stroke-dashoffset: 0; } }
.rate { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.rate-q { margin-right: 2px; font-size: 12px; color: var(--ink-3); }
.rate-note { font-size: 12px; color: var(--ok); }
.empty-day { padding: 18px 16px; font-size: 14px; color: var(--ink-2); }
.empty-day p { margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.ai-msg { margin: 8px 0 0; font-size: 12.5px; color: var(--warn); }

.hanamaru { display: flex; align-items: center; gap: 14px; padding: 4px 0; }
.hanamaru svg { width: 84px; height: 84px; flex: none; overflow: visible; }
.hanamaru p { margin: 0; font-family: var(--f-display); font-size: 19px; font-weight: 600; line-height: 1.4; }
.hanamaru p small { display: block; font-family: var(--f-body); font-size: 12.5px; font-weight: 500; color: var(--ink-2); }

/* 空のとき */
.empty { display: grid; gap: 14px; padding: 18px 16px; }
.empty p { margin: 0; color: var(--ink-2); font-size: 14px; }
.example { position: relative; border-style: dashed; box-shadow: none; }
.example .stamp-ex { position: absolute; top: -10px; right: 12px; padding: 0 8px; border: 1.5px solid var(--red); border-radius: 4px; background: var(--sheet); color: var(--red); font-size: 12px; font-weight: 700; transform: rotate(4deg); }

/* ---------- 計画 ---------- */
.pace-list, .subj-list, .days { list-style: none; margin: 0; padding: 0; }
.pace { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; padding: 12px 14px; border-top: 1px dashed var(--rule); }
.pace:first-child { border-top: 0; }
.pace-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pace-name { font-weight: 700; overflow-wrap: anywhere; }
.pace-meta { font-size: 12.5px; color: var(--ink-2); }
.bar { position: relative; height: 10px; margin-block: 6px 4px; border-radius: 4px; background: var(--sheet-2); border: 1px solid var(--rule); overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; }
.bar .b-done { left: 0; background: var(--c); }
.bar .b-plan { background: repeating-linear-gradient(135deg, var(--c) 0 2px, transparent 2px 5px); opacity: 0.55; }
.legend-row { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-3); }
.legend-row span { display: inline-flex; align-items: center; gap: 6px; }
.legend-row i { width: 20px; height: 10px; border-radius: 2px; border: 1px solid var(--rule); }
.legend-row .lg-done { background: var(--ink-2); }
.legend-row .lg-plan { background: repeating-linear-gradient(135deg, var(--ink-2) 0 2px, transparent 2px 5px); }

.day { border-top: 1px dashed var(--rule); }
.day:first-child { border-top: 0; }
.day-head { width: 100%; display: grid; grid-template-columns: minmax(86px, max-content) minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 11px 14px; border: 0; background: none; text-align: left; cursor: pointer; }
.day-date { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
.day-md { font-family: var(--f-num); font-size: 14px; font-weight: 600; }
.day-wd { font-size: 12px; color: var(--ink-2); }
.day.sun .day-wd { color: var(--red); }
.day.sat .day-wd { color: var(--blue); }
.day.is-today .day-md { background: linear-gradient(transparent 58%, var(--marker) 58%); }
.day-bar { display: flex; height: 12px; border-radius: 3px; background: var(--sheet-2); border: 1px solid var(--rule); overflow: hidden; }
.day-bar i { display: block; height: 100%; background: var(--c); border-right: 1px solid var(--sheet); }
.day-sum { font-family: var(--f-num); font-size: 13px; font-weight: 600; white-space: nowrap; }
.day-sum small { font-family: var(--f-body); font-size: 11px; font-weight: 500; color: var(--ink-3); }
.day.off .day-sum { color: var(--ink-3); }
.day-items { list-style: none; margin: 0; padding: 0 14px 12px 96px; display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }
.day-items li { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.day-items .dot { width: 7px; height: 7px; border-radius: 2px; background: var(--c); flex: none; align-self: center; }
.day-items .it { min-width: 0; overflow-wrap: anywhere; }
.day-items .m { margin-left: auto; padding-left: 8px; font-family: var(--f-num); font-size: 12px; white-space: nowrap; }
.day-items .ok { color: var(--red); font-weight: 700; }
.day-exam { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 0 14px 12px 96px; font-size: 13px; font-weight: 700; }
.stamp { display: inline-block; padding: 0 6px; border: 1.5px solid var(--red); border-radius: 3px; color: var(--red); font-size: 11.5px; font-weight: 700; transform: rotate(-4deg); }
.day-edit { display: grid; gap: 8px; padding: 0 14px 14px 96px; }
.day-edit p { margin: 0; font-size: 12.5px; color: var(--ink-2); }
.more { justify-self: center; }

/* ---------- 科目 ---------- */
.subj { width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr) 16px; gap: 12px; align-items: center; padding: 14px; border: 0; border-top: 1px dashed var(--rule); background: none; text-align: left; cursor: pointer; }
.subj-list li:first-child .subj { border-top: 0; }
.subj-body { display: grid; gap: 2px; min-width: 0; }
.subj-name { font-weight: 700; overflow-wrap: anywhere; }
.subj-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 12.5px; color: var(--ink-2); }
.chev { color: var(--ink-3); font-size: 18px; }
.lv { display: inline-flex; gap: 3px; vertical-align: 1px; }
.lv i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--ink-3); }
.lv i.on { background: var(--ink-2); border-color: var(--ink-2); }
.subj.past { opacity: 0.6; }

<script>
(function () {
  'use strict';
  var E = window.PlannerEngine;
  var TR = window.TocReader;
  var SK = window.StudyKit;
  var AK = window.AdvisorKit; // 学習アドバイザーAI（単元提案・コマの進め方）
  var NATIVE = !!(window.ReactNativeWebView && window.NativeAI); // スマホアプリ（端末内AI）の中で動いているか

  /* ============ 定数・小道具 ============ */
  var DEFAULT_SETTINGS = { weekdayMin: 90, weekendMin: 180, sessionMin: 30, overrides: {} };
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  var LEVEL_DESC = { 1: 'ほぼゼロ', 2: '苦手', 3: 'ふつう', 4: '得意', 5: 'ほぼ完璧' };
  var HINTS = {
    learn: '教科書とノートで要点を確認し、例題を1つ自分で解く',
    practice: '問題集・課題・過去問を解き、間違えた問題に印をつける',
    review: '前に解いた問題を、答えを見ずにもう一度解く',
    final: '全範囲の公式・用語を見直し、印をつけた問題を解き直す',
  };
  var HINT_CRUNCH = '時間が足りないので、重要な公式・用語と代表的な例題だけを一通り確認する';
  var CAP_OPTIONS = [0, 30, 45, 60, 90, 120, 150, 180, 240, 300];
  var MIN_OPTIONS = [0, 30, 45, 60, 75, 90, 105, 120, 150, 180, 210, 240, 300, 360, 420, 480];
  var SESSION_OPTIONS = [25, 30, 45, 60];
  var LS_DATA = 'ai-study-planner/v1';
  var TABS = ['today', 'study', 'plan', 'subjects', 'settings'];

  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function rid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function md(s) { var p = s.split('-'); return Number(p[1]) + '/' + Number(p[2]); }
  function wdOf(s) { return WD[E.weekday(E.dayNum(s))]; }
  function mdw(s) { return md(s) + '（' + wdOf(s) + '）'; }
  function daysUntil(s) { return E.dayNum(s) - E.dayNum(todayStr()); }
  function firstChar(name) { var a = Array.from(String(name || '').trim()); return a[0] || '・'; }
  var fmt = E.fmtMin;
  function approx(m) { if (m < 60) return m + '分'; var h = Math.round(m / 30) / 2; return h + '時間'; }
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function normalizeSettings(v) {
    var n = E.normSettings(Object.assign({}, DEFAULT_SETTINGS, v || {}));
    return { weekdayMin: n.weekdayMin, weekendMin: n.weekendMin, sessionMin: n.sessionMin, overrides: Object.assign({}, n.overrides) };
  }
  function defaultUnitNames() { return ['範囲 1', '範囲 2', '範囲 3', '範囲 4']; }
  function defaultUnits() { return defaultUnitNames().map(function (n) { return { name: n, from: null, to: null }; }); }

  /* ============ 保存（アカウント／この端末） ============ */
  var Store = (function () {
    var mode = 'loading';
    var ready = false;
    var col = null;
    var unsub = null;
    var data = { settings: clone(DEFAULT_SETTINGS), subjects: {}, days: {}, learn: {} };
    var pending = new Map();
    var inflight = new Set();
    var again = new Set();
    var version = 0;
    var onChange = function () {};
    var notify = function () {};
    var saveTimer = null;

    function applyDoc(target, id, value) {
      if (id === 'settings') target.settings = value ? normalizeSettings(value) : clone(DEFAULT_SETTINGS);
      else if (id.indexOf('s_') === 0) { if (value) target.subjects[id.slice(2)] = value; else delete target.subjects[id.slice(2)]; }
      else if (id.indexOf('d_') === 0) { if (value) target.days[id.slice(2)] = value; else delete target.days[id.slice(2)]; }
      else if (id.indexOf('l_') === 0) { if (value) target.learn[id] = value; else delete target.learn[id]; }
    }
    function changed() { version++; onChange(); }

    function init(cb, note) {
      onChange = cb;
      notify = note;
      var cl = window.claude;
      var dbP = cl && typeof cl.use === 'function' ? Promise.resolve(cl.use('db')).catch(function () { return null; }) : Promise.resolve(null);
      var userP = cl && typeof cl.use === 'function' ? Promise.resolve(cl.use('user')).catch(function () { return null; }) : Promise.resolve(null);
      return Promise.all([dbP, userP]).then(function (r) {
        var db = r[0];
        var user = r[1];
        if (!db || !user) return null;
        return Promise.resolve(user.id()).catch(function () { return null; }).then(function (uid) { return uid ? { db: db, uid: uid } : null; });
      }).then(function (cloud) {
        if (cloud) {
          try {
            col = cloud.db.collection('data/users/' + cloud.uid);
            mode = 'cloud';
            subscribe(false);
            return;
          } catch (e) { col = null; }
        }
        loadLocal();
      });
    }

    function subscribe(isRetry) {
      unsub = col.onSnapshot(function (snap) {
        var next = { settings: clone(DEFAULT_SETTINGS), subjects: {}, days: {}, learn: {} };
        snap.docs.forEach(function (d) { applyDoc(next, d.id, clone(d.data())); });
        pending.forEach(function (v, id) { applyDoc(next, id, v === null ? null : clone(v)); });
        data = next;
        ready = true;
        changed();
      }, function (err) {
        if (err && err.code === 'unavailable' && !isRetry) { setTimeout(function () { if (mode === 'cloud') subscribe(true); }, 1500); return; }
        fallbackToLocal('sync');
      });
    }

    function loadLocal() {
      var raw = null;
      try { raw = window.localStorage.getItem(LS_DATA); mode = 'local'; } catch (e) { mode = 'memory'; }
      if (raw) {
        try {
          var o = JSON.parse(raw);
          data = { settings: normalizeSettings(o.settings), subjects: o.subjects || {}, days: o.days || {}, learn: o.learn || {} };
        } catch (e) { /* 壊れたデータは無視 */ }
      }
      ready = true;
      changed();
    }
    function saveLocal() {
      if (mode !== 'local') return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () {
        if (!lsSet(LS_DATA, JSON.stringify(data))) { mode = 'memory'; notify('この端末に保存できません。タブを閉じると記録が消えます。'); changed(); }
      }, 250);
    }

    function put(id, value) {
      applyDoc(data, id, value === null ? null : clone(value));
      if (mode === 'cloud') { pending.set(id, value === null ? null : clone(value)); flush(id); }
      else saveLocal();
      changed();
    }
    function writeOnce(id, value) {
      var ref = col.doc(id);
      var go = function () { return value === null ? ref.delete() : ref.set(value); };
      return go().catch(function (e) {
        if (e && e.code === 'unavailable') return sleep(400 + Math.random() * 600).then(go);
        throw e;
      });
    }
    function flush(id) {
      if (inflight.has(id)) { again.add(id); return; }
      inflight.add(id);
      var value;
      var loop = function () {
        again.delete(id);
        value = pending.get(id);
        return writeOnce(id, value).then(function () { if (again.has(id) && mode === 'cloud') return loop(); });
      };
      loop().then(function () {
        if (pending.get(id) === value) pending.delete(id);
      }).catch(function (e) {
        if (e && e.code === 'quota_exceeded') notify('保存できる量の上限に達しました。終わった科目を削除してください。');
        else fallbackToLocal('write');
      }).then(function () { inflight.delete(id); });
    }
    function fallbackToLocal(reason) {
      if (mode !== 'cloud') return;
      try { if (unsub) unsub(); } catch (e) { /* noop */ }
      unsub = null;
      col = null;
      pending.clear();
      mode = lsSet(LS_DATA, JSON.stringify(data)) ? 'local' : 'memory';
      ready = true;
      notify(reason === 'write' ? 'アカウントに保存できなかったので、この端末に保存します。' : '同期が止まったので、この端末に保存します。');
      changed();
    }
    function resetAll() {
      var ids = ['settings'].concat(Object.keys(data.subjects).map(function (k) { return 's_' + k; }), Object.keys(data.days).map(function (k) { return 'd_' + k; }), Object.keys(data.learn));
      ids.forEach(function (id) { put(id, null); });
    }

    return {
      init: init,
      put: put,
      resetAll: resetAll,
      get data() { return data; },
      get mode() { return mode; },
      get ready() { return ready; },
      get version() { return version; },
    };
  })();

  /* ============ AI（AIアドバイザー：Claude の sample で動く） ============ */
  var AI = { fn: null, state: 'checking', busy: null, ctl: null, undoUnits: null, images: null };
  var AI_HIDE = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];
  function aiMessage(code) {
    if (AI_HIDE.indexOf(code) >= 0) return 'この画面ではAI機能を使えません。';
    switch (code) {
      case 'rate_limited': return '混み合っています。少し時間をおいてから試してください。';
      case 'invalid_json': return 'AIの返事をうまく読み取れませんでした。もう一度試してください。';
      case 'refused': return 'この内容ではAIが提案できませんでした。入力を変えて試してください。';
      case 'session_expired': return 'ログインし直してから試してください。';
      case 'prompt_too_large': return '入力が長すぎます。試験範囲メモを短くしてください。';
      case 'model_missing': return 'AIのモデルがまだ入っていません。設定の「端末のAI」からダウンロードしてね（初回だけ・Wi-Fi推奨）。';
      case 'model_load_failed': return 'AIのモデルを読み込めませんでした。ほかのアプリを閉じるか、設定の「端末のAI」でモデルを入れ直してください。';
      case 'too_long': return '入力が長すぎて端末のAIでは扱えませんでした。試験範囲メモや写真の枚数を減らしてください。';
      case 'busy': return '端末のAIがほかの作業中です。終わってからもう一度試してください。';
      default: return 'AIに接続できませんでした。もう一度試してください。';
    }
  }
  function initAI() {
    if (NATIVE) window.NativeAI.onStatus(function () { if (ui.tab === 'settings') render(); });
    var cl = window.claude;
    var p = cl && typeof cl.use === 'function' ? Promise.resolve(cl.use('sample')).catch(function () { return null; }) : Promise.resolve(null);
    p.then(function (fn) {
      AI.fn = typeof fn === 'function' ? fn : null;
      AI.state = AI.fn ? 'ready' : 'off';
      if (!AI.fn || typeof AI.fn.limits !== 'function') return null;
      // 写真を送れるか（送れる枚数・大きさ・形式）
      return Promise.resolve().then(function () { return AI.fn.limits(); }).catch(function () { return null; }).then(function (caps) {
        AI.images = caps && caps.images && caps.images.maxCount > 0 ? caps.images : null;
      });
    }).then(function () {
      if (!(ui.tab === 'subjects' && ui.editing)) render();
      else syncAiButtons();
    });
  }
  function syncAiButtons() {
    var ready = AI.state === 'ready';
    var b1 = $('#aiUnitsBtn');
    var b2 = $('#tocBtn');
    if (b1) { b1.hidden = !ready; b1.disabled = !!AI.busy; }
    if (b2) { b2.hidden = !(ready && AI.images) || !!TOC; b2.disabled = !!AI.busy; }
    var row = $('#unitTools');
    if (row) row.hidden = !(b1 && !b1.hidden) && !(b2 && !b2.hidden);
  }

  /* ============ 画面の状態 ============ */
  var ui = {
    tab: 'today',
    editing: null,
    study: null,
    early: null,
    openDay: null,
    capOpen: false,
    showDays: 14,
    justDone: null,
    hanamaru: false,
    aiMsg: '',
    dismissed: {},
  };

  /* ============ 計画（キャッシュ付き） ============ */
  var memo = { key: '', plan: null, boost: undefined };
  function subjectList() {
    return Object.keys(Store.data.subjects).map(function (k) { return Store.data.subjects[k]; })
      .filter(function (s) { return s && s.id && s.examDate; })
      .sort(function (a, b) { return a.examDate < b.examDate ? -1 : a.examDate > b.examDate ? 1 : String(a.name).localeCompare(String(b.name), 'ja'); });
  }
  function planInput(over) {
    return Object.assign({ today: todayStr(), settings: Store.data.settings, subjects: subjectList(), days: Store.data.days }, over || {});
  }
  function getPlan() {
    var key = Store.version + '|' + todayStr();
    if (memo.key !== key) memo = { key: key, plan: E.computePlan(planInput()), boost: undefined };
    return memo.plan;
  }
  function getBoost() {
    var p = getPlan();
    if (memo.boost === undefined) memo.boost = p.totalShortage ? E.suggestBoost(planInput()) : null;
    return memo.boost;
  }
  function settingsN() { return E.normSettings(Store.data.settings); }
  function capOn(date) { return E.capacityOf(E.dayNum(date), settingsN()); }
  function hasOverride(date) { var o = Store.data.settings.overrides || {}; return Object.prototype.hasOwnProperty.call(o, date); }
  function colorOf(sid) { var s = Store.data.subjects[sid]; return s ? (Number(s.color) || 0) % 8 : 0; }
  function nextColor() {
    var used = subjectList().filter(function (s) { return s.examDate >= todayStr(); }).map(function (s) { return Number(s.color) % 8; });
    for (var i = 0; i < 8; i++) if (used.indexOf(i) < 0) return i;
    return subjectList().length % 8;
  }
  function phaseLabel(x) {
    if (x.ph === 'review') return x.nth ? '復習' + x.nth + '回目' : '復習';
    return E.PHASES[x.ph] + (x.cont ? '（続き）' : '');
  }
  function unitName(x) {
    if (x.ph === 'final') return '全範囲';
    var s = Store.data.subjects[x.sid];
    var u = s && (s.units || []).find(function (u) { return u.id === x.uid; });
    return u ? u.name : '（削除した単元）';
  }

  /* ============ 操作 ============ */
  function toDocSession(x) {
    var o = { id: rid(), sid: x.sid, uid: x.uid == null ? null : x.uid, ph: x.ph, min: x.min, done: false };
    if (x.nth) o.nth = x.nth;
    if (x.cont) o.cont = true;
    if (x.crunch) o.crunch = true;
    return o;
  }
  // 今日の計画を記録用に確定した形で取り出す（まだ確定していなければ、今の提案を確定する）
  function todayDraft() {
    var t = todayStr();
    var cur = Store.data.days[t];
    if (cur) return clone(cur);
    return { date: t, sessions: getPlan().today.sessions.map(toDocSession), updatedAt: Date.now() };
  }
  function saveDay(doc) { doc.updatedAt = Date.now(); Store.put('d_' + doc.date, doc); }
  function visibleSessions(doc) { return doc.sessions.filter(function (x) { return Store.data.subjects[x.sid]; }); }

  function toggleSession(key) {
    var doc = todayDraft();
    var list = visibleSessions(doc);
    var x = key.charAt(0) === '#' ? list[Number(key.slice(1))] : list.find(function (s) { return s.id === key; });
    if (!x) return;
    if (!x.done) {
      var info = finishSession(x);
      ui.justDone = x.id;
      if (list.every(function (s) { return s.done; })) ui.hanamaru = true;
      ui.early = info && info.isEarly ? { id: x.id, fresh: true } : ui.early && ui.early.id === x.id ? null : ui.early;
      saveDay(doc);   // お祝いはコマの下のカードで出す（同じ文のトーストは重ねない）
    } else {
      x.done = false;
      delete x.doneAt;
      delete x.rating;
      delete x.actual;
      if (ui.early && ui.early.id === x.id) ui.early = null;
      saveDay(doc);
    }
  }
  // コマを終える。時間を計っていれば止めて、実際にかかった時間（分）を残す
  function finishSession(x) {
    var now = Date.now();
    x.done = true;
    x.doneAt = now;
    if (x.timer) {
      x.timer = SK.timerPause(x.timer, now);
      if (x.timer.acc >= 30000) x.actual = SK.actualMinutes(x.timer, now);
      else delete x.actual;
    }
    return SK.earlyInfo(x);
  }
  // タイマー：はじめる（再開）／一時停止。動かせるのは1つだけ
  function timerAction(key, start) {
    var doc = todayDraft();
    var list = visibleSessions(doc);
    var x = key.charAt(0) === '#' ? list[Number(key.slice(1))] : list.find(function (s) { return s.id === key; });
    if (!x || x.done) return;
    var now = Date.now();
    if (start) {
      doc.sessions.forEach(function (s) { if (s !== x && s.timer && s.timer.since != null) s.timer = SK.timerPause(s.timer, now); });
      x.timer = SK.timerStart(x.timer, now);
    } else if (x.timer) x.timer = SK.timerPause(x.timer, now);
    saveDay(doc);
  }
  function tickTimers() {
    var els = document.querySelectorAll('[data-timer]');
    if (!els.length) return;
    var now = Date.now();
    Array.prototype.forEach.call(els, function (el) {
      var acc = Number(el.getAttribute('data-acc')) || 0;
      var since = el.getAttribute('data-since');
      el.textContent = SK.fmtClock(acc + (since ? now - Number(since) : 0));
    });
  }
  function paceNote(x, info) {
    var ps = SK.paceSummary(Store.data.days, todayStr(), x.id);
    if (ps.usual && info.ratio < ps.usual - 0.05) return 'いつもより速いペースです（ふだんは予定の' + Math.round(ps.usual * 100) + '%、今回は' + Math.round(info.ratio * 100) + '%）。';
    return '';
  }
  // 「早」のはんこ（赤ペンの丸と、うれしさの線）
  function earlyStamp(animate, small) {
    var bursts = ['M60 6l5-6', 'M68 22l7-2', 'M4 6L-1 0', 'M-4 22l-7-2'];
    return '<svg class="early-stamp' + (small ? ' small' : '') + (animate ? ' pop' : '') + '" viewBox="-12 -8 88 80" aria-hidden="true">' +
      '<path class="pen' + (animate ? ' draw' : '') + '" pathLength="100" d="M32 8A25 25 0 1 1 18.4 12"/>' +
      '<text x="32" y="43" text-anchor="middle">早</text>' +
      (small ? '' : bursts.map(function (d) { return '<path class="pen burst' + (animate ? ' draw' : '') + '" pathLength="100" d="' + d + '"/>'; }).join('')) + '</svg>';
  }
  function earlyHtml(x, info) {
    var big = ui.early && ui.early.id === x.id;
    if (!big) return '<p class="early-chip">' + earlyStamp(false, true) + '予定より' + info.early + '分早く終わりました</p>';
    var pace = paceNote(x, info);
    return '<div class="early" role="status">' + earlyStamp(ui.early.fresh && !REDUCED, false) +
      '<div class="early-body"><p class="early-title">はやい！ 予定より' + info.early + '分早く終わりました</p>' +
      '<p>予定 ' + info.planned + '分 → <b>' + info.actual + '分</b></p>' + (pace ? '<p>' + esc(pace) + '</p>' : '') +
      '<p>浮いた' + info.early + '分は、ひと休みにも、先取りにも使えます。</p>' +
      '<div class="btn-row"><button class="btn ghost small" data-act="early-ok">やったね</button></div></div></div>';
  }
  function timerHtml(x, key) {
    var t = x.timer;
    var running = !!(t && t.since != null);
    var acc = t ? Number(t.acc) || 0 : 0;
    if (!running && !acc) return '<button class="timer-btn" data-act="timer-start" data-key="' + esc(key) + '">' + ICON_PLAY + 'はじめる</button>';
    return '<span class="timer' + (running ? ' on' : '') + '"><span class="tm" data-timer data-acc="' + acc + '" data-since="' + (running ? t.since : '') + '">' + SK.fmtClock(SK.timerElapsed(t, Date.now())) + '</span><small> / ' + x.min + '分</small></span>' +
      '<button class="timer-btn" data-act="' + (running ? 'timer-pause' : 'timer-start') + '" data-key="' + esc(key) + '">' + (running ? ICON_PAUSE + '一時停止' : ICON_PLAY + '再開') + '</button>';
  }
  function rateSession(id, v) {
    var cur = Store.data.days[todayStr()];
    if (!cur) return;
    var doc = clone(cur);
    var x = doc.sessions.find(function (s) { return s.id === id; });
    if (!x || !x.done) return;
    if (x.rating === v) delete x.rating; else x.rating = v;
    saveDay(doc);
  }
  function sig(list) { return list.filter(function (x) { return !x.done; }).map(function (x) { return [x.sid, x.uid, x.ph, x.min].join(':'); }).join('|'); }
  // 今日の未完了分を作り直す（完了したコマは残す）
  function replanToday(silent) {
    var t = todayStr();
    var cur = Store.data.days[t];
    if (!cur) { if (!silent) toast('今日の計画はいまの状態で最新です'); return; }
    var r = E.replanToday(planInput());
    var keptIds = r.kept.map(function (k) { return k.id; });
    var doc = clone(cur);
    var kept = doc.sessions.filter(function (x) { return x.done; });
    var next = kept.concat(r.fresh.map(toDocSession));
    if (silent && sig(next) === sig(doc.sessions)) return;
    doc.sessions = next;
    var ids = next.map(function (x) { return x.id; });
    ['tips', 'advice'].forEach(function (key) {   // 消えたコマのAIの提案も消す
      if (doc[key]) Object.keys(doc[key]).forEach(function (k) { if (ids.indexOf(k) < 0) delete doc[key][k]; });
    });
    saveDay(doc);
    if (!silent) toast(keptIds.length ? '終わったコマはそのままに、残りを組み直しました' : '今日の計画を組み直しました');
  }

  // 入力された単元（名前・ページ）を、前の単元IDに対応づける（記録を引き継ぐため）
  function matchUnits(oldUnits, parsed) {
    var used = {};
    var byName = {};
    var names = parsed.map(function (p) { return p.name; });
    oldUnits.forEach(function (u) { if (!byName[u.name]) byName[u.name] = u; });
    var ids = names.map(function (n) {
      var u = byName[n];
      if (u && !used[u.id]) { used[u.id] = 1; return u.id; }
      return null;
    });
    // 同じ位置の単元名を書き換えただけなら、記録を引き継ぐ
    ids.forEach(function (r, i) {
      var u = oldUnits[i];
      if (!r && u && !used[u.id] && names.indexOf(u.name) < 0) { used[u.id] = 1; ids[i] = u.id; }
    });
    return parsed.map(function (p, i) {
      var o = { id: ids[i] || rid(), name: p.name };
      if (p.from) { o.from = p.from; if (p.to) o.to = p.to; }
      return o;
    });
  }
  function readForm() {
    var f = $('#subjForm');
    if (!f) return null;
    var fd = new FormData(f);
    // 1行に1単元。「名前 p.12-25」のようにページがあれば読み取る
    var lines = String(fd.get('units') || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean).slice(0, MAX_UNITS);
    var units = TR.fillMissingEnds(lines.map(TR.parseUnitLine)).filter(function (u) { return u.name; });
    return {
      name: String(fd.get('name') || '').trim().slice(0, 30),
      examDate: String(fd.get('examDate') || ''),
      level: Number(fd.get('level')) || 3,
      volume: String(fd.get('volume') || 'normal'),
      note: String(fd.get('note') || '').trim().slice(0, 80),
      units: units,
    };
  }
  function estimateUnits(units, level, volume) {
    return E.subjectRequirement({ level: level, volume: volume, units: units.map(function (u, i) { return { id: 'x' + i, name: u.name, from: u.from, to: u.to }; }) }, []);
  }
  function updateEstimate() {
    var v = readForm();
    var el = $('#estimate');
    if (!v || !el) return;
    var units = v.units.length ? v.units : defaultUnits();
    var req = estimateUnits(units, v.level, v.volume);
    var sm = TR.summarize(units);
    var detail;
    if (sm.known === units.length) detail = units.length + '単元・' + sm.pages + 'ページから見積もり ＋ 総復習 ' + fmt(req.final);
    else if (sm.known > 0) detail = units.length + '単元（うち' + sm.known + '単元はページ数から見積もり）＋ 総復習 ' + fmt(req.final);
    else {
      var u = req.units[0];
      var per = u ? u.learn + u.practice + sum(u.reviews) : 0;
      detail = units.length + '単元 × ' + fmt(per) + '（理解・演習・復習）＋ 総復習 ' + fmt(req.final);
    }
    el.innerHTML = '<span>必要な学習時間の目安</span><b>' + esc(fmt(req.total)) + '</b><span>' + esc(detail) + '</span>';
  }
  function submitSubject() {

  /* ============ AI：単元の提案・今日の進め方 ============ */
  // プロンプトの組み立て・返事の検証は AdvisorKit（advisor/advisor.js）。ここは画面とのつなぎだけ
  function aiSuggestUnits() {
    if (AI.state !== 'ready' || AI.busy) return;
    var v = readForm();
    var msg = $('#aiUnitsMsg');
    var btn = $('#aiUnitsBtn');
    var ta = $('#f-units');
    if (!v || !msg || !btn || !ta) return;
    if (!v.name) { msg.textContent = '先に科目名を入れてください。'; $('#f-name').focus(); return; }
    var before = ta.value;
    var input = AK.buildUnitsInput(v, todayStr()); // 今ある単元は existing_units として渡し、重ねない
    AI.busy = 'units';
    AI.ctl = new AbortController();
    var lab = btn.querySelector('.tool-label');
    if (lab) lab.textContent = '考え中…';
    syncAiButtons();
    msg.textContent = 'AIが試験範囲を単元に分けています。';
    AI.fn.json(AK.samplePrompt('suggest_units', input), { modelTier: 'quick', signal: AI.ctl.signal }).then(function (out) {
      var r = AK.validateUnits(out, input, rid);
      if (!document.body.contains(ta)) return;
      if (r.status === 'out_of_scope') { msg.textContent = '学習の範囲として読み取れませんでした。科目名と試験範囲メモを確かめてね。'; return; }
      if (!r.units.length && !r.questions.length) throw { code: 'invalid_json' };
      // 今ある単元の後ろに足す（ページが分かれば「名前 p.12-25」の形）
      var lines = r.units.map(TR.formatUnitLine);
      if (lines.length) {
        ta.value = (before.trim() ? before.replace(/\s+$/, '') + '\n' : '') + lines.join('\n');
        AI.undoUnits = before;
      }
      msg.innerHTML = (lines.length ? esc(lines.length + '個の単元を入れました。' + (r.message ? r.message + '。' : '') + '自由に書き直せます。') : '') +
        (r.questions.length ? '<span class="ai-ask">' + esc('もっと正確にするには、試験範囲メモに書き足してね：' + r.questions.join(' ／ ')) + '</span>' : '') +
        (lines.length && before.trim() ? ' <button type="button" class="linkish" data-act="ai-units-undo">元に戻す</button>' : '');
      updateEstimate();
    }).catch(function (e) {
      var code = e && e.code;
      if (document.body.contains(msg)) msg.textContent = code === 'cancelled' ? '' : aiMessage(code);
      if (AI_HIDE.indexOf(code) >= 0) AI.state = 'off';
    }).then(function () {
      AI.busy = null;
      AI.ctl = null;
      if (lab && document.body.contains(lab)) lab.textContent = 'AIで単元を提案';
      syncAiButtons();
    });
  }
  // そのコマの単元の、前回の手応え（easy / ok / hard）
  function lastRatingOf(x) {
    var t = todayStr();
    var dates = Object.keys(Store.data.days).filter(function (d) { return d < t; }).sort().reverse();
    for (var i = 0; i < dates.length; i++) {
      var hit = (Store.data.days[dates[i]].sessions || []).find(function (s) { return s.sid === x.sid && s.uid === x.uid && s.rating; });
      if (hit) return hit.rating;
    }
    return null;
  }
  // 学習記録で「要復習」になっている問題の数
  function dueCountOf(x) {
    var doc = Store.data.learn[SK.docKey(x.sid, x.ph === 'final' ? null : x.uid)];
    return doc ? SK.dueProblems(doc).length : null;
  }
  // まだ終わっていないコマに、AIの進め方がすべて付いているか（「聞き直す」の判定）
  function adviceComplete(doc) {
    var adv = (doc && doc.advice) || {};
    var undone = doc ? visibleSessions(doc).filter(function (x) { return !x.done; }) : [];
    return undone.length > 0 && undone.every(function (x) { return adv[x.id] && adv[x.id].source === 'ai'; });
  }
  function aiTips() {
    if (AI.state !== 'ready' || AI.busy) return;
    var doc = todayDraft();
    var targets = visibleSessions(doc).filter(function (x) { return !x.done; });
    if (!targets.length) return;
    var again = adviceComplete(Store.data.days[doc.date]);
    if (!Store.data.days[doc.date]) saveDay(doc);
    var t = todayStr();
    var input = AK.buildAdviceInput(targets.map(function (x) {
      return AK.sessionInput(x, Store.data.subjects[x.sid], {
        unit: unitName(x), pages: unitPagesLabel(x), today: t, lastRating: lastRatingOf(x), dueProblems: dueCountOf(x),
      });
    }), t);
    AI.busy = 'tips';
    AI.ctl = new AbortController();
    ui.aiMsg = '';
    render();
    var save = function (r) {   // 戻り値：基本の進め方にしたコマの数（前のAIの提案を残したコマは数えない）
      var fb = 0;
      var cur = Store.data.days[doc.date];
      var next = clone(cur || doc);
      next.advice = Object.assign({}, next.advice || {});
      next.tips = Object.assign({}, next.tips || {});
      r.advice.forEach(function (a) {
        var prev = next.advice[a.id];
        if (a.source !== 'ai' && prev && prev.source === 'ai') return; // 聞き直しに失敗しても、前にもらったAIの提案は残す
        if (a.source !== 'ai') fb++;
        next.advice[a.id] = { headline: a.headline, plan: a.plan, point: a.point, cheer: a.cheer, source: a.source, v: input.prompt_version };
        if (a.source === 'ai') next.tips[a.id] = AK.toTip(a); // 1文の形も残す（古い表示・ほかの端末向け）
        else delete next.tips[a.id];
      });
      saveDay(next);
      return fb;
    };
    var failMsg = function (fb) {
      return fb ? 'AIの提案を読み取れなかったので、' + (fb < targets.length ? fb + 'コマを' : '') + '基本の進め方にしました。もう一度聞くと作り直します。'
        : 'AIの提案を読み取れなかったので、前の提案をそのまま残しました。';
    };
    // 聞き直すときは、5分間のキャッシュを使わずに作り直す
    AI.fn.json(AK.samplePrompt('session_advice', input), { modelTier: 'quick', signal: AI.ctl.signal, cache: !again }).then(function (out) {
      var r = AK.validateAdvice(out, input);
      var fb = save(r);
      if (!r.ok) ui.aiMsg = failMsg(fb);
      else if (fb) ui.aiMsg = fb + 'コマはAIの提案が使えなかったので、基本の進め方にしました。';
    }).catch(function (e) {
      var code = e && e.code;
      if (code === 'invalid_json') ui.aiMsg = failMsg(save(AK.validateAdvice(null, input)));
      else ui.aiMsg = code === 'cancelled' ? '' : aiMessage(code);
      if (AI_HIDE.indexOf(code) >= 0) AI.state = 'off';
    }).then(function () {
      AI.busy = null;
      AI.ctl = null;
      render();
    });
  }
  // コマの下の進め方（ゴール・手順と分・ポイント）。終わったコマはゴールだけ
  function adviceHtml(a, done) {
    var mark = a.source === 'ai' ? '<span class="ai-mark">AI</span>' : '<span class="ai-mark base">基本</span>';
    var h = '<div class="adv"><p class="adv-head">' + mark + esc(a.headline) + '</p>';
    if (!done) {
      h += '<ol class="adv-plan">' + (a.plan || []).map(function (p) {
        return '<li><span class="adv-min">' + Number(p.min) + '分</span><span>' + esc(p.do) + '</span></li>';
      }).join('') + '</ol>';
      if (a.point) h += '<p class="adv-point"><b>ここがポイントだよ</b>' + esc(a.point) + (a.cheer ? '<span class="adv-cheer">' + esc(a.cheer) + '</span>' : '') + '</p>';
    }
    return h + '</div>';
  }

  /* ============ 目次の写真から単元を読み取る ============ */
  var MAX_UNITS = 40;
  var TOC = null; // 編集画面で読み取りパネルを開いている間の状態
  var SVG_A = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  var ICON_CAMERA = SVG_A + '<path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.4-2h5l1.4 2h1.6A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg>';
  var ICON_SPARK = SVG_A + '<path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg>';
  var ICON_PLUS = SVG_A + '<path d="M12 5.5v13M5.5 12h13"/></svg>';
  var ICON_TOC = SVG_A + '<path d="M7.5 3.5H14l4 4V19a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19V5a1.5 1.5 0 0 1 1.5-1.5z"/><path d="M9 11h6M9 14.5h6M9 18h3.5"/></svg>';

  function unitPagesLabel(x) {
    if (x.ph === 'final') return '';
    var s = Store.data.subjects[x.sid];
    var u = s && (s.units || []).find(function (u) { return u.id === x.uid; });
    return u && u.from ? TR.formatPages(u.from, u.to, '〜') : '';
  }
  function tocReset() {
    if (TOC) {
      if (TOC.ctl) TOC.ctl.abort();
      TOC.files.forEach(function (f) { try { URL.revokeObjectURL(f.url); } catch (e) { /* noop */ } });
    }
    TOC = null;
  }
  function tocOpen() {
    if (TOC || AI.state !== 'ready' || !AI.images || AI.busy) return;
    TOC = { step: 'pick', files: [], data: null, gran: 1, sel: null, by: 'all', msg: '', ctl: null, memo: '', count: 0, latest: '', readKey: '' };
    tocRender();
    var add = $('#tocFile');
    if (add) { try { add.focus({ preventScroll: true }); } catch (e) { add.focus(); } }
  }
  function tocClose() {
    tocReset();
    tocRender();
    var b = $('#tocBtn');
    if (b && !b.hidden) { try { b.focus({ preventScroll: true }); } catch (e) { b.focus(); } }
  }
  function tocAddFiles(list) {
    if (!TOC || TOC.step === 'reading') return;
    var max = AI.images ? AI.images.maxCount : 4;
    var arr = Array.prototype.slice.call(list || []).filter(function (f) { return f && (!f.type || f.type.indexOf('image/') === 0); });
    if (!arr.length) { TOC.msg = '画像ファイルを選んでください。'; tocRender(); return; }
    var room = Math.max(0, max - TOC.files.length);
    TOC.msg = arr.length > room ? '一度に読み取れる写真は' + max + '枚までです。' : '';
    TOC.pickHint = false;
    arr.slice(0, room).forEach(function (f) { TOC.files.push({ id: rid(), file: f, url: URL.createObjectURL(f) }); });
    TOC.step = 'pick';
    tocRender();
  }
  function tocRemove(id) {
    if (!TOC || TOC.step === 'reading') return;
    TOC.files = TOC.files.filter(function (f) {
      if (f.id !== id) return true;
      URL.revokeObjectURL(f.url);
      return false;
    });
    TOC.msg = '';
    tocRender();
  }

  /* 写真を送る形にする。大きい写真は上下（見開きは左右）に少し重ねて分け、小さい文字も読めるようにする */
  function loadImage(blob) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function () { resolve({ img: img, url: url }); };
      img.onerror = function () { URL.revokeObjectURL(url); reject({ code: 'decode' }); };
      img.src = url;

  function makeHandCircle() {
    var pts = [];
    for (var i = 0; i <= 52; i++) {
      var t = i / 52;
      var a = ((-112 + 388 * t) * Math.PI) / 180;
      var r = 15 + 1.1 * Math.sin(3 * a + 0.7) + 1.8 * t;
      pts.push((22 + r * Math.cos(a) * 1.05).toFixed(1) + ' ' + (22 + r * Math.sin(a) * 0.95).toFixed(1));
    }
    return 'M' + pts.join(' L');
  }
  function makeHanamaru() {

    for (i = 0; i <= 110; i++) {
      t = i / 110;
      a = t * Math.PI * 5.4 - Math.PI / 2;
      r = 3 + t * R * 0.5;
      sp.push((c + r * Math.cos(a)).toFixed(1) + ' ' + (c + r * Math.sin(a)).toFixed(1));
    }
    for (i = 0; i <= 200; i++) {
      a = (i / 200) * Math.PI * 2 + 0.9;
      r = R * (0.78 + 0.22 * Math.pow(Math.abs(Math.sin(4 * a)), 0.7));
      pe.push((c + r * Math.cos(a)).toFixed(1) + ' ' + (c + r * Math.sin(a)).toFixed(1));
    }
    return { spiral: 'M' + sp.join(' L'), petals: 'M' + pe.join(' L') };
  }

    return '<li class="sess' + (x.done ? ' is-done' : '') + (early ? ' is-early' : '') + '">' +
      tileHtml(s) +
      '<div class="sess-body">' +
        '<div class="sess-top"><span class="sess-subj">' + esc(s.name) + '</span><span class="sess-min">' + minHtml + '</span></div>' +
        '<div class="sess-meta"><span class="ph ph-' + x.ph + '">' + esc(phaseLabel(x)) + '</span><span class="sess-unit">' + esc(unitName(x)) + '</span>' + (unitPagesLabel(x) ? '<span class="sess-pg">' + esc(unitPagesLabel(x)) + '</span>' : '') + (x.extra ? '<span class="tag">追加</span>' : '') + '</div>' +
        (adv ? adviceHtml(adv, x.done) : '<p class="sess-hint">' + (tip ? '<span class="ai-mark">AI</span>' : '') + esc(hint) + '</p>') +
        '<div class="sess-actions">' + (x.done ? '' : timerHtml(x, key)) +
          '<button class="study-link" data-act="study-from-today" data-key="' + esc(key) + '">' + ICON_PENCIL + (x.ph === 'final' ? '総復習の問題と解説' : '問題と解説') + ' ›</button></div>' +
        (x.done && locked ? ratingRow(x) : '') +
        (early && !bigEarly ? earlyHtml(x, info) : '') +
      '</div>' +
      '<button class="check" data-act="toggle" data-key="' + esc(key) + '" data-focus="chk-' + esc(key) + '" aria-pressed="' + (x.done ? 'true' : 'false') + '" aria-label="' + esc(label + (x.done ? '（完了。もう一度押すと未完了に戻す）' : 'を完了にする')) + '">' +
        checkSvg(x.done, ui.justDone && ui.justDone === x.id) +
      '</button>' +
      (bigEarly ? earlyHtml(x, info) : '') +
    '</li>';
  }
  function ratingRow(x) {
    var opts = [['easy', 'かんたん'], ['ok', 'ふつう'], ['hard', 'むずかしい']];
    var note = x.rating === 'hard' ? (x.ph === 'final' ? '総復習を20分ふやしました' : '復習を1回ふやしました') : x.rating === 'easy' && x.ph !== 'final' ? '復習を1回へらしました' : '';

      }).join('') +
      (note ? '<span class="rate-note">' + note + '</span>' : '') + '</div>';
  }

  /* ============ 今日 ============ */
  function exampleCard() {
    var rows = [
      { c: 0, n: '応用数学', ph: 'learn', l: '理解', u: 'フーリエ級数', m: 45, h: HINTS.learn },
      { c: 2, n: '電気回路', ph: 'practice', l: '演習', u: 'キルヒホッフの法則', m: 30, h: HINTS.practice, done: true },
      { c: 1, n: 'アルゴリズムとデータ構造', ph: 'review', l: '復習2回目', u: '整列アルゴリズム', m: 15, h: HINTS.review },
    ];
    return '<div class="sheet example" aria-label="表示の例"><span class="stamp-ex">例</span><ul class="sess-list">' +
      rows.map(function (r) {
        return '<li class="sess' + (r.done ? ' is-done' : '') + '"><span class="tile" style="--c: var(--c' + r.c + ')" aria-hidden="true">' + firstChar(r.n) + '</span>' +
          '<div class="sess-body"><div class="sess-top"><span class="sess-subj">' + r.n + '</span><span class="sess-min">' + r.m + '<small>分</small></span></div>' +
          '<div class="sess-meta"><span class="ph ph-' + r.ph + '">' + r.l + '</span><span class="sess-unit">' + r.u + '</span></div>' +
          '<p class="sess-hint">' + r.h + '</p></div>' +
          '<span class="check" aria-hidden="true">' + checkSvg(!!r.done, false) + '</span></li>';
      }).join('') + '</ul></div>';
  }
  function emptyToday(loading) {
    return '<section class="section first"><div class="sheet empty">' +
      '<h2 class="h2">' + (loading ? '今日のメニューを準備しています' : 'まずは科目を登録しましょう') + '</h2>' +
      '<p>科目・試験日・いまの理解度を入れると、試験日から逆算した毎日の学習メニューがここに並びます。苦手な科目ほど時間を多めに取り、できなかった分は翌日以降に組み直します。</p>' +
      exampleCard() +
      '<div class="btn-row"><button class="btn primary" data-act="new-subject"' + (loading ? ' disabled' : '') + '>科目を登録する</button>' +
      '<button class="btn ghost" data-act="samples"' + (loading ? ' disabled' : '') + '>高専のサンプルで試す</button></div>' +
      '</div></section>';
  }
  function readjustInfo() {
    var t = todayStr();
    var subs = Store.data.subjects;
    var past = Object.keys(Store.data.days).filter(function (d) { return d < t; }).sort();
    if (!past.length) return null;
    var last = past[past.length - 1];
    if (ui.dismissed[last] || lsGet('dismiss/' + last) === '1') return null;
    if (E.dayNum(t) - E.dayNum(last) > 14) return null;
    var undone = (Store.data.days[last].sessions || []).filter(function (x) { return !x.done && subs[x.sid] && subs[x.sid].examDate >= t; });
    if (!undone.length) return null;
    return { date: last, n: undone.length, min: sum(undone.map(function (x) { return x.min; })) };
  }
  function notesHtml(plan, list) {
    var t = todayStr();
    var h = '';
    var examToday = list.filter(function (s) { return s.examDate === t; });
    if (examToday.length) {
      h += '<div class="note"><p>今日は<b>' + esc(examToday.map(function (s) { return s.name; }).join('、')) + '</b>の試験日です。直前は要点の確認だけにして、落ち着いて臨みましょう。</p></div>';
    }
    var ra = readjustInfo();
    if (ra) {
      h += '<div class="note"><p>' + esc(mdw(ra.date)) + 'にできなかった' + ra.n + 'コマ（' + esc(fmt(ra.min)) + '）は、今日からの計画に組み直しました。</p>' +
        '<div class="btn-row"><button class="btn ghost small" data-act="dismiss" data-date="' + ra.date + '">OK</button></div></div>';
    }
    if (plan.totalShortage > 0) {
      var shorts = list.filter(function (s) { return plan.stats[s.id] && plan.stats[s.id].shortage > 0; });
      var names = shorts.map(function (s) { return s.name + '（約' + approx(plan.stats[s.id].shortage) + '）'; }).join('、');
      var boost = getBoost();
      h += '<div class="note warn"><p>このペースだと、<b>' + esc(names) + '</b>が試験までに終わりません。</p>' +
        (boost && boost.add
          ? '<div class="btn-row"><button class="btn primary small" data-act="boost" data-add="' + boost.add + '">毎日あと' + boost.add + '分ふやす</button><button class="btn ghost small" data-act="tab" data-tab="plan">日ごとに調整する</button></div>'
          : '<p>時間を増やしても間に合わない量です。試験範囲の量を「少なめ」にするか、単元を絞ってください。試験が近い科目は総復習で全範囲を一通り押さえる計画にしています。</p><div class="btn-row"><button class="btn ghost small" data-act="tab" data-tab="subjects">科目を見直す</button></div>') +
        '</div>';
    }
    return h ? '<div class="notes">' + h + '</div>' : '';
  }
  function renderToday() {
    if (!Store.ready) return emptyToday(true);
    var list = subjectList();
    if (!list.length) return emptyToday(false);
    var t = todayStr();
    var plan = getPlan();
    var doc = Store.data.days[t];
    var locked = !!doc;
    var sessions = locked ? visibleSessions(doc) : plan.today.sessions;
    var tips = (doc && doc.tips) || {};
    var advice = (doc && doc.advice) || {};
    var total = sum(sessions.map(function (x) { return x.min; }));
    var doneMin = sum(sessions.filter(function (x) { return x.done; }).map(function (x) { return x.min; }));
    var doneN = sessions.filter(function (x) { return x.done; }).length;
    var cap = capOn(t);
    var ov = hasOverride(t);
    var allDone = sessions.length > 0 && doneN === sessions.length;
    var pct = total ? Math.min(100, Math.round((doneMin / total) * 100)) : 0;
    var ds = SK.daySummary(sessions);
    var aheadMsg = ds.timed && ds.early >= SK.EARLY_MIN ? '予定より合計' + ds.early + '分早く終わりました。' : '';

    var h = '<section class="summary">';
    h += '<div class="sum-head"><h2 class="h2">今日のメニュー</h2>' +
      '<button class="cap-btn" data-act="cap-open" aria-expanded="' + ui.capOpen + '" data-focus="cap-open">使える時間 <b>' + (cap === 0 ? '休み' : esc(fmt(cap))) + '</b>' + (ov ? '（今日だけ）' : '') + ' <span aria-hidden="true">▾</span></button></div>';
    if (ui.capOpen) {
      h += '<div class="sheet cap-edit"><p>今日は何分くらい勉強できますか？ 選ぶと、まだ終わっていない分を組み直します。</p><div class="chips">' +
        CAP_OPTIONS.map(function (m) { return '<button class="chip' + (m === cap ? ' on' : '') + '" data-act="cap" data-date="' + t + '" data-min="' + m + '">' + (m === 0 ? '休み' : fmt(m)) + '</button>'; }).join('') +
        (ov ? '<button class="chip" data-act="cap" data-date="' + t + '" data-min="">いつもどおり</button>' : '') + '</div></div>';
    }
    if (allDone) {
      h += '<div class="hanamaru"><svg viewBox="0 0 120 120" aria-hidden="true"><path class="pen' + (ui.hanamaru ? ' draw' : '') + '" pathLength="100" d="' + HANAMARU.petals + '"/><path class="pen' + (ui.hanamaru ? ' draw' : '') + '" pathLength="100" d="' + HANAMARU.spiral + '"/></svg>' +
        '<p>今日のメニュー完了<small>' + esc(fmt(doneMin)) + ' やりきりました。' + esc(aheadMsg) + (aheadMsg && SK.paceSummary(Store.data.days, t, null).saved7 > ds.early ? 'この7日間で浮いた時間は合計' + esc(fmt(SK.paceSummary(Store.data.days, t, null).saved7)) + '。' : '') +
        (aheadMsg ? '浮いた時間は好きに使いましょう。' : '余裕があれば「もう1コマ」で先に進めます。') + '</small></p></div>';
    } else if (sessions.length) {
      h += '<div class="meter" role="progressbar" aria-label="今日の進み具合" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
        '<p class="meter-text"><span><span class="big">' + doneMin + '</span> / ' + total + '分</span><span>' + sessions.length + 'コマ中 ' + doneN + 'コマ完了</span>' +
        (aheadMsg ? '<span class="ahead">' + earlyStamp(false, true) + '予定より' + ds.early + '分早いペース</span>' : '') + '</p>';
    }
    h += '</section>';
    h += notesHtml(plan, list);

    if (sessions.length) {
      h += '<ul class="sheet sess-list">' + sessions.map(function (x, i) { return sessionRow(x, i, tips, locked, advice); }).join('') + '</ul>';
    } else {
      var msg;
      if (cap === 0) msg = '今日は休みの日に設定されています。時間がとれたら「使える時間」から変えられます。';
      else if (list.every(function (s) { return s.examDate < t; })) msg = '登録した科目の試験はすべて終わりました。次の試験の科目を登録しましょう。';
      else if (list.some(function (s) { return s.examDate === t; }) && list.every(function (s) { return s.examDate <= t; })) msg = '今日の試験が最後です。おつかれさまでした。';
      else msg = '今日やるべき分はありません。余裕があれば「もう1コマ」で先に進められます。';
      h += '<div class="sheet empty-day"><p>' + esc(msg) + '</p></div>';
    }

    var hasUndone = sessions.some(function (x) { return !x.done; });
    h += '<div class="actions">' +
      '<button class="btn ghost" data-act="extra" data-focus="extra">＋ もう1コマ</button>' +
      (locked ? '<button class="btn ghost" data-act="replan" data-focus="replan">残りを組み直す</button>' : '');
    if (AI.state === 'ready' && hasUndone) {
      h += AI.busy === 'tips'
        ? '<button class="btn ghost" disabled>AIが考え中…</button><button class="btn ghost small" data-act="ai-stop">やめる</button>'
        : '<button class="btn ghost" data-act="ai-tips" data-focus="ai-tips">' + (adviceComplete(doc) ? 'AIに進め方を聞き直す' : 'AIに進め方を聞く') + '</button>';
    }
    h += '</div>';
    if (ui.aiMsg) h += '<p class="ai-msg" role="alert">' + esc(ui.aiMsg) + '</p>';
    return h;
  }

  /* ============ 計画 ============ */
  function emptyGeneric(text) {
    return '<section class="section first"><div class="sheet empty"><h2 class="h2">まだ科目がありません</h2><p>' + esc(text) + '</p>' +
      '<div class="btn-row"><button class="btn primary" data-act="new-subject"' + (Store.ready ? '' : ' disabled') + '>科目を登録する</button>' +
      '<button class="btn ghost" data-act="samples"' + (Store.ready ? '' : ' disabled') + '>高専のサンプルで試す</button></div></div></section>';
  }
  function paceRow(s, st) {
    var req = st ? st.required : 0;
    var done = st ? st.done : 0;
    var planned = st ? Math.min(st.planned, Math.max(0, req - done)) : 0;
    var dw = req ? (done / req) * 100 : 0;
    var pw = req ? (planned / req) * 100 : 0;
    return '<li class="pace">' + tileHtml(s, 'sm') + '<div><div class="pace-top"><span class="pace-name">' + esc(s.name) + '</span>' + statusPill(st) + '</div>' +
      '<div class="bar" style="--c: var(--c' + ((Number(s.color) || 0) % 8) + ')"><i class="b-done" style="width:' + dw.toFixed(1) + '%"></i><i class="b-plan" style="left:' + dw.toFixed(1) + '%;width:' + pw.toFixed(1) + '%"></i></div>' +
      '<div class="pace-meta"><span class="num">' + esc(fmt(done)) + '</span> / ' + esc(fmt(req)) + ' ・ 試験 ' + esc(mdw(s.examDate)) + ' ' + esc(untilLabel(s)) +
      (st && st.queueDoneDay ? ' ・ 単元は' + esc(md(st.queueDoneDay)) + 'までに一巡' : '') + '</div></div></li>';
  }
  function dayRow(d) {
    var n = E.dayNum(d.date);
    var w = E.weekday(n);
    var cap = capOn(d.date);
    var used = sum(d.sessions.map(function (x) { return x.min; }));
    var open = ui.openDay === d.date;
    var ov = hasOverride(d.date);
    var exams = (d.exams || []).map(function (id) { return Store.data.subjects[id]; }).filter(Boolean);
    var scale = Math.max(cap, used, 1);
    var cls = 'day' + (d.isToday ? ' is-today' : '') + (w === 0 ? ' sun' : w === 6 ? ' sat' : '') + (cap === 0 ? ' off' : '');
    var segs = d.sessions.map(function (x) {
      return '<i style="width:' + ((x.min / scale) * 100).toFixed(2) + '%;--c: var(--c' + colorOf(x.sid) + ')"></i>';
    }).join('');
    var h = '<li class="' + cls + '">';
    h += '<button class="day-head" data-act="day" data-date="' + d.date + '" aria-expanded="' + open + '" data-focus="day-' + d.date + '">' +
      '<span class="day-date"><span class="day-md">' + md(d.date) + '</span><span class="day-wd">' + WD[w] + (d.isToday ? '・今日' : '') + '</span></span>' +
      '<span class="day-bar" aria-hidden="true">' + segs + '</span>' +
      '<span class="day-sum">' + (cap === 0 && !used ? '休み' : used + '<small>/' + cap + '分</small>') + '</span></button>';
    if (exams.length) h += '<div class="day-exam"><span class="stamp">試験</span>' + esc(exams.map(function (s) { return s.name; }).join('、')) + '</div>';
    if (d.sessions.length) {
      h += '<ul class="day-items">' + d.sessions.map(function (x) {
        var s = Store.data.subjects[x.sid];
        return '<li style="--c: var(--c' + colorOf(x.sid) + ')"><span class="dot" aria-hidden="true"></span><span class="it">' + esc(s.name) + '・' + esc(phaseLabel(x)) + (x.ph === 'final' ? '' : '・' + esc(unitName(x))) + '</span><span class="m">' + (x.done ? '<span class="ok">済</span> ' : '') + x.min + '分</span></li>';
      }).join('') + '</ul>';
    }
    if (open) {
      h += '<div class="day-edit"><p>' + esc(mdw(d.date)) + 'に勉強に使える時間</p><div class="chips">' +
        CAP_OPTIONS.map(function (m) { return '<button class="chip' + (m === cap ? ' on' : '') + '" data-act="cap" data-date="' + d.date + '" data-min="' + m + '">' + (m === 0 ? '休み' : fmt(m)) + '</button>'; }).join('') +
        (ov ? '<button class="chip" data-act="cap" data-date="' + d.date + '" data-min="">いつもどおり</button>' : '') + '</div></div>';
    }
    return h + '</li>';
  }
  function renderPlan() {
    if (!Store.ready) return emptyGeneric('読み込み中です。');
    var list = subjectList();
    if (!list.length) return emptyGeneric('科目を登録すると、試験日までの見通しと日別の計画がここに出ます。');
    var t = todayStr();
    var plan = getPlan();
    var active = list.filter(function (s) { return s.examDate >= t; });
    var h = '<section class="section first"><div class="sec-head"><h2 class="h2">試験までの見通し</h2></div>';
    if (active.length) {
      h += '<ul class="sheet pace-list">' + active.map(function (s) { return paceRow(s, plan.stats[s.id]); }).join('') + '</ul>' +
        '<div class="legend-row"><span><i class="lg-done"></i>終わった分</span><span><i class="lg-plan"></i>試験までに入っている予定</span></div>';
    } else {
      h += '<div class="sheet empty-day"><p>これからの試験はありません。</p></div>';
    }
    h += '</section>';

    var doc = Store.data.days[t];
    var todayEntry = { date: t, isToday: true, sessions: doc ? visibleSessions(doc) : plan.today.sessions, exams: list.filter(function (s) { return s.examDate === t; }).map(function (s) { return s.id; }) };
    var days = [todayEntry].concat(plan.days);
    var shown = days.slice(0, ui.showDays);
    h += '<section class="section"><div class="sec-head"><h2 class="h2">日別の計画</h2><span class="sec-note">日付をタップすると、その日に使える時間を変えられます</span></div>';
    h += '<ol class="sheet days">' + shown.map(dayRow).join('') + '</ol>';
    if (days.length > shown.length) h += '<button class="btn ghost small more" data-act="more">さらに14日分を表示</button>';
    h += '</section>';
    return h;
  }

  /* ============ 科目 ============ */
  function subjRow(s, st, past) {
    return '<li><button class="subj' + (past ? ' past' : '') + '" data-act="edit" data-id="' + esc(s.id) + '" data-focus="subj-' + esc(s.id) + '">' + tileHtml(s) +
      '<span class="subj-body"><span class="subj-name">' + esc(s.name) + (s.sample ? '<span class="tag">サンプル</span>' : '') + '</span>' +
      '<span class="subj-meta"><span>試験 ' + esc(mdw(s.examDate)) + ' ' + esc(untilLabel(s)) + '</span><span>理解度 ' + levelDots(s.level) + ' ' + esc(LEVEL_DESC[s.level] || '') + '</span><span>' + (s.units || []).length + '単元' + (TR.summarize(s.units || []).pages ? '・' + TR.summarize(s.units || []).pages + 'ページ' : '') + '</span></span>' +
      (st && !past ? '<span class="bar" style="--c: var(--c' + ((Number(s.color) || 0) % 8) + ')"><i class="b-done" style="width:' + (st.required ? ((st.done / st.required) * 100).toFixed(1) : 0) + '%"></i></span>' +
        '<span class="subj-meta"><span class="num">' + esc(fmt(st.done)) + ' / ' + esc(fmt(st.required)) + '</span>' + statusPill(st) + '</span>' : '') +
      '</span><span class="chev" aria-hidden="true">›</span></button></li>';
  }
  function renderSubjects() {

    var t = todayStr();

    if (!list.length) {
      h += '<div class="sheet empty"><p>まだ科目がありません。テストを受ける科目を、試験日と理解度といっしょに登録してください。</p><div class="btn-row"><button class="btn ghost" data-act="samples">高専のサンプルで試す</button></div></div>';
      return h + '</section>';

    h += '</section>';
    if (past.length) {
      h += '<section class="section"><div class="sec-head"><h2 class="h2">試験が終わった科目</h2></div><ul class="sheet subj-list">' + past.map(function (s) { return subjRow(s, null, true); }).join('') + '</ul></section>';
    }
    return h;
  }
  function renderEditor() {
    var isNew = ui.editing === 'new';
    var s = isNew ? { name: '', examDate: '', level: 3, volume: 'normal', note: '', units: [] } : Store.data.subjects[ui.editing];
    if (!s) { ui.editing = null; return renderSubjects(); }
    var t = todayStr();

    STU = { busy: null, ctl: null, msg: '', msgView: '', noteDraft: '', quizDraft: '', set: null, mode: null, revealed: {}, hints: {}, diff: null, count: 3, showOlder: false, chat: [], chatDraft: '', chatPid: null, chatStream: '', justMarked: null, batch: { files: [], hint: false }, batchResult: null, batchCount: 0 };

  // 写真の画面が開かないときの案内（アプリによってはページの中から写真を選べない）

  }
  // 写真の画面が開いている間に画面が描き直されても、撮った写真を受け取れるようにする
  function guardInput(input, area) {
    if (!input || input._guarded) return;
    input._guarded = true;
    input.addEventListener('change', function () {
      if (document.contains(input)) return;          // ふだんは document 側の change で受け取る
      if (area === 'batch') batchAdd(input.files);
      else if (TOC) tocAddFiles(input.files);
      input.value = '';
    });
    input.addEventListener('cancel', function () {   // 画面は開いた（閉じただけ）→ 案内は不要
      if (area === 'batch' && STU && STU.batch.hint) { STU.batch.hint = false; render(); }
      if (area === 'toc' && TOC && TOC.pickHint) { TOC.pickHint = false; tocRender(); }
    });
  }
  function watchPicker(lab) {
    var area = lab.getAttribute('data-pick');
    var input = lab.control || document.getElementById(lab.htmlFor);
    guardInput(input, area);
    if (NATIVE) return; // アプリではカメラ・写真の画面がそのまま開くので、ブラウザの案内は出さない
    var opened = false;
    var mark = function () { opened = true; };
    window.addEventListener('blur', mark);
    document.addEventListener('visibilitychange', mark);
    if (input) input.addEventListener('cancel', mark, { once: true });
    setTimeout(function () {
      window.removeEventListener('blur', mark);
      document.removeEventListener('visibilitychange', mark);
      if (opened) return;
      if (area === 'toc' && TOC && !TOC.pickHint && !TOC.files.length) { TOC.pickHint = true; tocRender(); }
      if (area === 'batch' && STU && !STU.batch.hint && !STU.batch.files.length) { STU.batch.hint = true; render(); }
    }, 2500);
  }

  /* --- 学習の操作 --- */
  function studyFail(e, view) {
    var code = e && e.code;
    if (!STU || code === 'cancelled') return;
    if (AI_HIDE.indexOf(code) >= 0) AI.state = 'off';
    if (code === 'images_unavailable') AI.images = null;
    STU.msg = code === 'no_problems' ? '問題をうまく作れませんでした。もう一度試してください。'
      : code === 'grade_unreadable' ? '答案を読み取れませんでした。明るい所で、答案全体がまっすぐ写るように撮り直してください。'
      : code === 'decode' || code === 'image_rejected' || code === 'images_unavailable' ? tocErrorMessage(code)
        : aiMessage(code);

  }
  function makeNote(fresh) {

      if (STU === stu) {
        stu.busy = null;

      }
      Store.put(SK.docKey(sid, uid), SK.setNote(learnDoc(sid, uid) || SK.emptyDoc(sid, uid), res.text, s.level, Date.now()));
    }).catch(function (e) {
      if (STU === stu) studyFail(e, 'note');

  function makeProblems(mode) {
    if (!STU || STU.busy || AI.state !== 'ready' || !ui.study) return;
    var sid = ui.study.sid;
    var uid = ui.study.uid;
    var s = Store.data.subjects[sid];
    var stu = STU;
    var doc = learnDoc(sid, uid) || SK.emptyDoc(sid, uid);
    var diff = stu.diff || SK.defaultDifficulty(s.level, ui.study.ph);
    var opt = { count: stu.count, diff: diff, avoid: doc.problems.map(function (p) { return p.q; }) };
    if (mode === 'similar') {
      var weak = currentSet(doc).filter(function (p) { var r = todayResult(p); return r === 'miss' || r === 'meh'; });
      if (!weak.length) weak = SK.dueProblems(doc);
      opt.similar = weak.map(function (p) { return p.q; });
      opt.count = Math.max(1, Math.min(5, weak.length));
    }
    stu.busy = 'quiz';
    stu.quizDraft = '';
    stu.msg = '';
    stu.ctl = new AbortController();
    render();
    scrollToEl($('[data-quiz-progress]'));
    AI.fn(AK.studyPrompt(SK.problemsPrompt(studyCtx(s, uid), opt)), {
      cache: false,
      signal: stu.ctl.signal,
      onText: function (u) {
        if (STU !== stu) return;
        var before = SK.countStarted(stu.quizDraft);

      var ps = SK.parseProblems(res.text, { max: opt.count });

      var r = SK.addProblems(learnDoc(sid, uid) || SK.emptyDoc(sid, uid), ps, diff, Date.now(), rid);
      if (STU === stu) {
        stu.set = r.doc.problems.filter(function (p) { return p.set === r.set; }).map(function (p) { return p.id; });

        stu.revealed = {};
        stu.hints = {};
        stu.busy = null;
        if (ps.length < opt.count) { stu.msg = (res.truncated ? '返事が途中で切れたため、' : '') + ps.length + '問だけ作れました。'; stu.msgView = 'quiz'; }
      }
      Store.put(SK.docKey(sid, uid), r.doc);
      return true;
    }).catch(function (e) {
      if (STU === stu) studyFail(e, 'quiz');
      return false;
    }).then(function (ok) {
      if (STU === stu) { stu.busy = null; stu.ctl = null; stu.quizDraft = ''; }

    });

      if (ui.tab === 'study') renderMath(view);

    if (fk) {
      var el = document.querySelector('[data-focus="' + fk.replace(/"/g, '') + '"]');
