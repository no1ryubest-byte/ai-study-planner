    ui.justDone = null;
    ui.hanamaru = false;
    if (STU) STU.justMarked = null;
    if (ui.early) ui.early.fresh = false;
  }
  function setTab(tab) {
    if (TABS.indexOf(tab) < 0) return;
    // 単元ページを開いたまま「学習」をもう一度押したら一覧へ
    if (tab === 'study' && ui.tab === 'study' && ui.study) {
      dropStudy();
      ui.study = null;
      render();
      window.scrollTo(0, 0);
      return;
    }
    ui.tab = tab;
    if (tab !== 'subjects') { ui.editing = null; tocReset(); }
    ui.capOpen = false;
    try { history.replaceState(null, '', '#' + tab); } catch (e) { /* noop */ }
    render();
    window.scrollTo(0, 0);
  }
  var toastTimer = null;
  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2800);
  }

  /* ============ イベント ============ */
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var act = el.dataset.act;
    if (!Store.ready && act !== 'tab') return;
    switch (act) {
      case 'tab': setTab(el.dataset.tab); break;
      case 'toggle': toggleSession(el.dataset.key); break;
      case 'rate': rateSession(el.dataset.id, el.dataset.v); break;
      case 'extra': addExtra(); break;
      case 'replan': replanToday(false); break;
      case 'cap-open': ui.capOpen = !ui.capOpen; render(); break;
      case 'cap': ui.capOpen = false; setOverride(el.dataset.date, el.dataset.min === '' ? null : Number(el.dataset.min)); break;
      case 'day': ui.openDay = ui.openDay === el.dataset.date ? null : el.dataset.date; render(); break;
      case 'more': ui.showDays += 14; render(); break;
      case 'boost': applyBoost(Number(el.dataset.add)); break;
      case 'dismiss': dismissReadjust(el.dataset.date); break;
      case 'new-subject':
        tocReset();
        ui.tab = 'subjects';
        ui.editing = 'new';
        try { history.replaceState(null, '', '#subjects'); } catch (e) { /* noop */ }
        render();
        window.scrollTo(0, 0);
        var nm = $('#f-name');
        if (nm) nm.focus({ preventScroll: true });
        break;
      case 'edit': tocReset(); ui.editing = el.dataset.id; render(); window.scrollTo(0, 0); break;
      case 'close-editor':
        if (AI.ctl && AI.busy === 'units') AI.ctl.abort();
        tocReset();
        ui.editing = null;
        render();
        break;
      case 'ask-delete': $('#delAsk').hidden = true; $('#delConfirm').hidden = false; break;
      case 'cancel-delete': $('#delAsk').hidden = false; $('#delConfirm').hidden = true; break;
      case 'delete-subject': deleteSubject(el.dataset.id); break;
      case 'samples': addSamples(); break;
      case 'ai-models': if (window.NativeAI) window.NativeAI.openModels(); break;
      case 'ai-check': runCheck(); break;
      case 'ai-check-stop': if (CHECK.ctl) CHECK.ctl.abort(); CHECK.running = false; render(); break;
      case 'remove-samples': removeSamples(); break;
      case 'ask-reset': $('#resetAsk').hidden = true; $('#resetConfirm').hidden = false; break;
      case 'cancel-reset': $('#resetAsk').hidden = false; $('#resetConfirm').hidden = true; break;
      case 'reset': Store.resetAll(); ui.editing = null; toast('すべてのデータを削除しました'); break;
      case 'ai-units': aiSuggestUnits(); break;
      case 'ai-units-undo':
        if (AI.undoUnits != null && $('#f-units')) { $('#f-units').value = AI.undoUnits; AI.undoUnits = null; $('#aiUnitsMsg').textContent = '元に戻しました。'; updateEstimate(); }
        break;
      case 'ai-tips': aiTips(); break;
      case 'ai-stop': if (AI.ctl) AI.ctl.abort(); break;
      case 'study-open': openStudy(el.dataset.sid, el.dataset.uid || null, 'study', null, null); break;
      case 'study-from-today': studyFromToday(el.dataset.key); break;
      case 'study-back': closeStudy(); break;
      case 'study-view': if (ui.study && STU) { ui.study.view = el.dataset.view; STU.msg = ''; render(); } break;
      case 'study-stop': if (STU && STU.ctl) STU.ctl.abort(); break;
      case 'note-make': makeNote(!!el.dataset.fresh); break;
      case 'quiz-make': makeProblems('new'); break;
      case 'quiz-similar': makeProblems('similar'); break;
      case 'quiz-diff': if (STU) { STU.diff = el.dataset.v; render(); } break;
      case 'quiz-count': if (STU) { STU.count = Number(el.dataset.v) || 3; render(); } break;
      case 'quiz-due': showDue(); break;
      case 'quiz-one': showOne(el.dataset.pid); break;
      case 'quiz-older': if (STU) { STU.showOlder = !STU.showOlder; render(); } break;
      case 'quiz-hint': if (STU) { STU.hints[el.dataset.pid] = true; render(); } break;
      case 'quiz-reveal': if (STU) { STU.revealed[el.dataset.pid] = true; render(); } break;
      case 'quiz-grade': gradeSelf(el.dataset.pid, el.dataset.r); break;
      case 'quiz-ask':
        if (STU && ui.study) {
          STU.chatPid = el.dataset.pid;
          STU.msg = '';
          ui.study.view = 'ask';
          render();
          window.scrollTo(0, 0);
        }
        break;
      case 'quiz-complete': completeFromStudy(el.dataset.r); break;
      case 'batch-grade': gradeBatch(); break;
      case 'batch-remove': batchRemove(el.dataset.id); break;
      case 'timer-start': timerAction(el.dataset.key, true); break;
      case 'timer-pause': timerAction(el.dataset.key, false); break;
      case 'early-ok': ui.early = null; render(); break;
      case 'copy-link':
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(PAGE_LINK).then(function () { toast('リンクをコピーしました。ブラウザに貼り付けて開いてください'); }, function () { toast(PAGE_LINK); });
        } else toast(PAGE_LINK);
        break;
      case 'ask-suggest': askQuestion(el.dataset.q); break;
      case 'ask-clear': if (STU) { STU.chatPid = null; render(); } break;
      case 'ask-reset': if (STU && !STU.busy) { STU.chat = []; STU.msg = ''; render(); } break;
      case 'toc-open': tocOpen(); break;
      case 'toc-close': tocClose(); break;
      case 'toc-remove': tocRemove(el.dataset.id); break;
      case 'toc-read': tocRead(false); break;
      case 'toc-read-again': tocRead(true); break;
      case 'toc-stop': if (TOC && TOC.ctl) TOC.ctl.abort(); break;
      case 'toc-retake': if (TOC) { TOC.step = 'pick'; TOC.data = null; TOC.msg = ''; tocRender(); } break;
      case 'toc-apply': tocApply(); break;
    }
  });
  document.addEventListener('click', function (ev) {
    var lab = ev.target.closest && ev.target.closest('label[data-pick]');
    if (lab) watchPicker(lab);
  });
  // 写真：ドラッグ＆ドロップと貼り付け（目次の読み取り・答案の採点）
  function dropZone(ev) {
    if (!ev.target.closest) return null;
    if (TOC) { var p = ev.target.closest('#tocPanel'); if (p) return p; }
    if (STU && STU.busy !== 'batch') { var b = ev.target.closest('#batchBox'); if (b) return b; }
    return null;
  }
  document.addEventListener('dragover', function (ev) {
    var p = dropZone(ev);
    if (!p) return;
    ev.preventDefault();
    p.classList.add('is-drop');
  });
  document.addEventListener('dragleave', function (ev) {
    var p = ev.target.closest ? ev.target.closest('#tocPanel, #batchBox') : null;
    if (p && !p.contains(ev.relatedTarget)) p.classList.remove('is-drop');
  });
  document.addEventListener('drop', function (ev) {
    var p = dropZone(ev);
    if (!p) return;
    ev.preventDefault();
    p.classList.remove('is-drop');
    var files = ev.dataTransfer && ev.dataTransfer.files;
    if (!files || !files.length) return;
    if (p.id === 'batchBox') batchAdd(files); else tocAddFiles(files);
  });
  document.addEventListener('paste', function (ev) {
    var files = ev.clipboardData && ev.clipboardData.files;
    if (!files || !files.length) return;
    if (TOC && TOC.step !== 'reading' && TOC.step !== 'review') { ev.preventDefault(); tocAddFiles(files); return; }
    if (ui.tab === 'study' && ui.study && ui.study.view === 'quiz' && STU && STU.busy !== 'batch' && $('#batchBox')) { ev.preventDefault(); batchAdd(files); }
  });
  document.addEventListener('submit', function (ev) {
    if (ev.target && ev.target.id === 'subjForm') { ev.preventDefault(); submitSubject(); }
    if (ev.target && ev.target.id === 'askForm') { ev.preventDefault(); var ai = $('#askInput'); askQuestion(ai ? ai.value : ''); }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.target && ev.target.id === 'askInput' && ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); askQuestion(ev.target.value); }
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'askInput') { if (STU) STU.chatDraft = ev.target.value; return; }
    if (ev.target.dataset && ev.target.dataset.toc) return;
    if (ev.target.closest && ev.target.closest('#subjForm')) { updateEstimate(); var er = $('#formError'); if (er) er.textContent = ''; }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.dataset && t.dataset.batch) { batchAdd(t.files); t.value = ''; return; }
    if (t.dataset && t.dataset.toc) { tocChange(t); return; }
    if (t.closest && t.closest('#subjForm')) {
      updateEstimate();
      if (TOC && TOC.step === 'review' && (t.name === 'level' || t.name === 'volume')) tocRender();
      return;
    }
    if (t.dataset && t.dataset.set) {
      var patch = {};
      patch[t.dataset.set] = Number(t.value);
      updateSettings(patch);
      toast('設定を変更し、計画を組み直しました');
    }
  });

  /* ============ 起動 ============ */
  var initialTab = (location.hash || '').replace('#', '');
  if (TABS.indexOf(initialTab) >= 0) ui.tab = initialTab;
  render();
  Store.init(function () { render({ fromData: true }); }, toast);
  initAI();
  var lastDay = todayStr();
  function checkDay() {
    var t = todayStr();
    if (t !== lastDay) { lastDay = t; ui.openDay = null; render({ fromData: true }); }
  }
  setInterval(checkDay, 30000);
  setInterval(tickTimers, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkDay(); });
})();
</script>
